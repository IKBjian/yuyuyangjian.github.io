<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love 玉玉</title>
    <style>
        /* --- 基础设置 (保持原样) --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffee; /* 米黄色背景 */
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* --- 开场按钮 (保持原样) --- */
        #intro-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffee;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s;
        }
        
        #start-btn {
            padding: 15px 40px;
            font-size: 24px;
            color: #fff;
            background-color: #ff4081;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* --- 画布层 (保持原样) --- */
        #treeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #fallingCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* --- 左侧情话区域 (保持原样) --- */
        #text-container {
            position: absolute;
            top: 15%; 
            left: 15%; 
            width: 400px;
            z-index: 10;
            display: none;
            pointer-events: none;
        }

        .text-line {
            font-size: 18px;
            line-height: 30px;
            color: #5d4037;
            margin-bottom: 5px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 1s;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
        }

        /* === 照片样式 (保持原样) === */
        #couple-photo {
            width: 200px; 
            height: auto;
            border-radius: 15px; 
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border: 4px solid #fff;
            display: none;
            opacity: 0;
            transition: opacity 2s ease;
            transform: rotate(-5deg);
        }

        /* === 核心修改：视频容器升级为 9:16 比例 === */
        #video-container {
            position: absolute;
            
            /* 1. 设置宽度 */
            width: 18vw; /* 使用 vw (屏幕宽度的百分比) 可以让它随网页大小自适应，你也可以改成固定像素如 220px */
            
            /* 2. 锁定 9:16 纵横比，高度会自动计算，绝不拉伸变形 */
            aspect-ratio: 9 / 16; 
            
            /* 3. 重新校准的红框定位 (基于 9:16 比例调整) */
            top: 20%;     /* 垂直居中附近 */
            left: 39%;    /* 水平定位 */
            
            z-index: 9; 
            display: none; 
            
            /* 样式美化 */
            border: 4px solid #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            overflow: hidden; 
        }

        /* 视频媒体本身满幅填充 */
        #my-video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 保证哪怕视频源不是9:16，也能居中裁剪填满，不留黑边 */
        }

        /* --- 底部计时器区域 (保持原样) --- */
        #timer-container {
            position: absolute;
            bottom: 20px;
            left: 10%; 
            width: 80%; 
            z-index: 10;
            display: none;
            border-bottom: 4px solid #333;
            padding-bottom: 5px;
            padding-left: 5%; 
        }

        .timer-header {
            font-size: 20px;
            color: #555;
            margin-bottom: 10px;
        }
        
        .timer-header span.green {
            color: #4caf50;
            font-weight: bold;
            font-size: 24px;
        }

        .timer-numbers {
            font-family: Arial, sans-serif;
            color: #1a1a1a;
            display: flex;
            align-items: baseline;
        }

        .timer-numbers span {
            font-size: 70px;
            line-height: 1;
            margin-right: 5px;
            font-weight: 400;
        }

        .timer-unit {
            font-size: 20px;
            color: #444;
            margin-right: 20px;
        }
    </style>
</head>
<body>

    <audio id="bgm" src="river.mp3" loop preload="auto"></audio>

    <div id="intro-layer">
        <button id="start-btn">来，点我</button>
    </div>

    <canvas id="treeCanvas"></canvas>
    <canvas id="fallingCanvas"></canvas>

    <div id="text-container">
        <img id="couple-photo" src="us.jpg" alt="Our Photo">
    </div>

    <div id="video-container">
        <video id="my-video" controls src="memory.mp4" loop muted></video>
    </div>

    <div id="timer-container">
        <div class="timer-header">土豆女王，<span class="green">我喜欢你</span> 已经是......</div>
        <div class="timer-numbers">
            <span id="d">0</span><b class="timer-unit">天</b>
            <span id="h">00</span><b class="timer-unit">小时</b>
            <span id="m">00</span><b class="timer-unit">分钟</b>
            <span id="s">00</span><b class="timer-unit">秒</b>
        </div>
    </div>

<script>
    // === JS 脚本保持不动 ===
    const startDate = new Date(2025, 3, 25, 22, 14); 

    const loveLines = [
        "这首曲子叫什么名字",
        "For River",
        "真老土，只有两个音符不停转换。",
        "Re，mi",
        "Remember me, 玉玉",
    ];

    const treeCanvas = document.getElementById('treeCanvas');
    const fallingCanvas = document.getElementById('fallingCanvas');
    const ctx = treeCanvas.getContext('2d');
    const fCtx = fallingCanvas.getContext('2d');

    let width, height;
    let branches = [];
    let treeLeaves = [];
    let fallingLeaves = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        treeCanvas.width = width;
        treeCanvas.height = height;
        fallingCanvas.width = width;
        fallingCanvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    document.getElementById('start-btn').addEventListener('click', function() {
        const audio = document.getElementById('bgm');
        audio.play().catch(function(error) {
            console.log("音乐播放失败");
        });

        document.getElementById('intro-layer').style.opacity = 0;
        setTimeout(() => document.getElementById('intro-layer').style.display = 'none', 1000);

        document.getElementById('text-container').style.display = 'block';
        document.getElementById('timer-container').style.display = 'block';
        
        const videoCont = document.getElementById('video-container');
        const myVideo = document.getElementById('my-video');
        videoCont.style.display = 'block'; 
        myVideo.play(); 

        initTree(); 
        loopTree(); 
        loopFalling(); 
        startTimer(); 
        startTypeWriter(); 
    });

    function Branch(x, y, angle, width, life) {
        this.x = x; this.y = y; this.angle = angle; this.width = width; this.life = life; this.speed = 3;
    }

    function initTree() {
        const rootX = width * 0.72; const rootY = height - 20; const initialLength = height * 0.12;
        branches.push(new Branch(rootX, rootY, Math.PI / 2, 20, initialLength));
    }

    function drawHeart(context, x, y, size, color) {
        context.save(); context.translate(x, y); context.scale(size/10, size/10); context.beginPath();
        context.moveTo(0, 0); context.bezierCurveTo(-5, -5, -10, 0, 0, 10); context.bezierCurveTo(10, 0, 5, -5, 0, 0);
        context.fillStyle = color; context.fill(); context.restore();
    }

    function getRandomColor() {
        const colors = ['#ff9a9e', '#ff6b6b', '#ff4081', '#ffc107', '#ffcc80'];
        return colors[Math.floor(Math.random() * colors.length)];
    }

    function loopTree() {
        if (branches.length > 0) {
            for (let i = branches.length - 1; i >= 0; i--) {
                const b = branches[i];
                const nextX = b.x - Math.cos(b.angle) * b.speed;
                const nextY = b.y - Math.sin(b.angle) * b.speed;
                ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(nextX, nextY); ctx.strokeStyle = '#3e2723';
                ctx.lineWidth = b.width; ctx.lineCap = 'round'; ctx.stroke();
                b.x = nextX; b.y = nextY; b.life -= 1;
                if (b.life <= 0) {
                    branches.splice(i, 1);
                    if (b.width > 2) {
                        const nextLife = b.width * 2.4 + Math.random() * 8;
                        branches.push(new Branch(b.x, b.y, b.angle - 0.25 - Math.random()*0.25, b.width*0.7, nextLife));
                        branches.push(new Branch(b.x, b.y, b.angle + 0.25 + Math.random()*0.25, b.width*0.7, nextLife));
                    } else {
                        treeLeaves.push({ x: b.x, y: b.y, size: 0, maxSize: 6 + Math.random() * 8, color: getRandomColor() });
                    }
                }
            }
        }
        if (treeLeaves.length > 0) {
            for (let i = treeLeaves.length - 1; i >= 0; i--) {
                const l = treeLeaves[i];
                if (l.size < l.maxSize) {
                    l.size += 0.5; drawHeart(ctx, l.x, l.y, l.size, l.color);
                    if (l.size >= l.maxSize) { treeLeaves.splice(i, 1); drawHeart(ctx, l.x, l.y, l.size, l.color); }
                }
            }
        }
        requestAnimationFrame(loopTree);
    }

    function FallingHeart() {
        this.x = Math.random() * (width * 0.6) + (width * 0.4); this.y = -20; this.size = Math.random() * 10 + 10;
        this.speedX = Math.random() * 1 + 0.5; this.speedY = Math.random() * 1.5 + 1; this.color = getRandomColor();
        this.rotation = Math.random() * Math.PI * 2; this.swing = Math.random() * 0.1; 
    }

    function loopFalling() {
        fCtx.clearRect(0, 0, width, height);
        if (Math.random() < 0.03) { fallingLeaves.push(new FallingHeart()); }
        for (let i = fallingLeaves.length - 1; i >= 0; i--) {
            const f = fallingLeaves[i]; f.x -= f.speedX + Math.sin(f.y * 0.01) * 0.5; f.y += f.speedY; f.rotation += f.swing;
            fCtx.save(); fCtx.translate(f.x, f.y); fCtx.rotate(f.rotation); drawHeart(fCtx, 0, 0, f.size, f.color); fCtx.restore();
            if (f.y > height || f.x < 0) { fallingLeaves.splice(i, 1); }
        }
        requestAnimationFrame(loopFalling);
    }

    function startTypeWriter() {
        let lineIndex = 0; const container = document.getElementById('text-container');
        function typeLine() {
            if (lineIndex < loveLines.length) {
                const div = document.createElement('div'); div.className = 'text-line'; div.innerText = loveLines[lineIndex];
                container.insertBefore(div, document.getElementById('couple-photo'));
                setTimeout(() => div.style.opacity = 1, 100); lineIndex++; setTimeout(typeLine, 1500); 
            } else { showPhoto(); }
        }
        setTimeout(typeLine, 1000);
    }

    function showPhoto() {
        const photo = document.getElementById('couple-photo'); photo.style.display = 'block';
        setTimeout(() => { photo.style.opacity = 1; }, 100);
    }

    function startTimer() {
        function update() {
            const now = new Date(); const diff = now - startDate;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById('d').innerText = d;
            document.getElementById('h').innerText = String(h).padStart(2, '0');
            document.getElementById('m').innerText = String(m).padStart(2, '0');
            document.getElementById('s').innerText = String(s).padStart(2, '0');
        }
        setInterval(update, 1000); update();
    }
</script>
</body>
</html>
